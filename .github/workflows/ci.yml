name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The tool catalog is a reviewed artifact: any byte of tools/list,
      # prompts/list or resources/templates/list that differs from
      # .mcp-catalog/sea-lite.json fails the job (npm run catalog:snapshot to refresh).
      - run: npm run catalog:check
