name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Linux, macOS and Windows: path separators (scope paths and worktrees
    # normalize backslashes), file modes (0600 is a no-op on Windows; POSIX-only
    # assertions are skipped there), SQLite locking across processes, and the
    # stdio and HTTP transports.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The tool catalog is a reviewed artifact: any byte of tools/list,
      # prompts/list or resources/templates/list that differs from
      # .mcp-catalog/sea-lite.json fails the job (npm run catalog:snapshot to refresh).
      - run: npm run catalog:check
